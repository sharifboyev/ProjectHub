[project]
name = "project"
version = "0.1.0"
description = "Project management and profiles dashboard API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic-settings>=2.2.1",
    "redis>=5.0.3",
    "pwdlib[argon2]>=0.2.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "aioboto3>=12.3.0",
    "pydantic[email]>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
